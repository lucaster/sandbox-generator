<h1>Hex Overall</h1>
<p>
  Generates one 19-hex patch with every layer on the same map: the biome as the
  background, the feature as the icon, factions as symbols, and landmark content
  as a coloured outline. Content is rolled only for hexes containing a Landmark.
</p>
<button type="button" (click)="patch.reset()">Reset SVG</button>
<button type="button" (click)="patch.draw()">Draw Hex Overall</button>
<button type="button" (click)="exportOverallPatch(patch)">Export JSON</button>
<label>
  Import JSON
  <input
    type="file"
    accept="application/json,.json"
    (change)="importOverallPatch($event, patch)"
  />
</label>
@if (importError(); as error) {
  <p role="alert">{{ error }}</p>
}

<app-hex-patch mode="overall" #patch />
