<button (click)="resetSvg()">Reset SVG</button>
<button (click)="drawBiomePatch()">Draw Biome Patch</button>
<button (click)="drawSampleHexPatch()">Draw Sample Hex Patch</button>
<section>
  <h3>Dynamic SVG polygon with JavaScript</h3>
  <svg
    #svg
    id="svg"
    [attr.width]="width()"
    [attr.height]="height()"
    style="border: 1px solid black"
  ></svg>
</section>
