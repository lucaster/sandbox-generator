<html>
  <head> </head>
  <body>
    <section>
      <h3>Using SVG (best for simple & scalable shapes)</h3>
      <svg width="400" height="300">
        <polygon
          points="
						50,50
						100,50
						100,100
						50,100
					"
          fill="lightblue"
          stroke="black"
          stroke-width="2"
        />
      </svg>
    </section>

    <section>
      <h3>Dynamic SVG polygon with JavaScript</h3>
      <svg id="svg" width="400" height="300" />
      <script>
        // Calculate regular hexagon points
        const centerX = 175;
        const centerY = 130;
        const radius = 50;
        const points = [];

        for (let i = 0; i < 6; i++) {
          const angle = (Math.PI / 3) * i; // 60 degrees in radians
          const x = centerX + radius * Math.cos(angle);
          const y = centerY + radius * Math.sin(angle);
          const px = Math.round(x * 100) / 100;
          const py = Math.round(y * 100) / 100;
          points.push([x, y]);
        }

        const polygon = document.createElementNS(
          "http://www.w3.org/2000/svg",
          "polygon"
        );

        polygon.setAttribute(
          "points",
          points.map((p) => p.join(",")).join(" ")
        );
        polygon.setAttribute("fill", "lightgreen");
        polygon.setAttribute("stroke", "black");
        polygon.setAttribute("stroke-width", "2");

        document.getElementById("svg").appendChild(polygon);
      </script>
    </section>

    <section>
      <h3>Using Canvas (best for performance & games)</h3>
      <canvas id="canvas" width="400" height="300"></canvas>
      <script>
        const canvas = document.getElementById("canvas");
        const ctx = canvas.getContext("2d");

        function drawPolygon(points) {
          ctx.beginPath();
          ctx.moveTo(points[0].x, points[0].y);
          for (let i = 1; i < points.length; i++) {
            ctx.lineTo(points[i].x, points[i].y);
          }
          ctx.closePath();

          ctx.fillStyle = "lightblue";
          ctx.fill();
          ctx.strokeStyle = "black";
          ctx.stroke();
        }

        drawPolygon([
          { x: 50, y: 50 },
          { x: 100, y: 50 },
          { x: 100, y: 100 },
          { x: 50, y: 100 },
        ]);
      </script>
    </section>
  </body>
</html>
