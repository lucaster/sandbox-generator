version: 2
updates:
  - package-ecosystem: npm
    directory: /sandbox-generator-ng
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      angular:
        patterns:
          - "@angular/*"
      development:
        dependency-type: development
        exclude-patterns:
          - "@angular/*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"
