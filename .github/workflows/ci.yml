name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: sandbox-generator-ng

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sandbox-generator-ng/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test -- --watch=false
        env:
          CHROME_BIN: /usr/bin/google-chrome
